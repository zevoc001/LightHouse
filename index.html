function money(n){n=Number(n)||0;return n.toLocaleString('ru-RU')+' ₽'}
function scoreMeasure(m,p){let score=m.match||60,reasons=[];let regionMatch=m.region==='Федеральный'||m.region===p.region;if(regionMatch){reasons.push(m.region==='Федеральный'?'Мера федерального уровня':'Совпадает регион реализации')}else{score-=18;reasons.push('Регион реализации отличается от региона в карточке')}
 let ind=(m.industries||[]).some(x=>x===p.industry||p.industry==='Информационные технологии'&&x==='ИТ');if(ind){reasons.push('Совпадает отраслевой профиль')}else{score-=6;reasons.push('Отраслевое совпадение не подтверждено')}
 let dir=(m.directions||[]).some(x=>(p.direction||'').toLowerCase().includes(x.toLowerCase())||x.toLowerCase().includes((p.direction||'').toLowerCase())||x==='Инновации');if(dir){reasons.push('Совпадает технологическое направление')}else{score-=5;reasons.push('Направление проекта совпадает не полностью')}
 let trl=Number(p.trl)||3;if(trl>=m.trlMin&&trl<=m.trlMax){reasons.push(`УГТ ${trl} входит в ориентир ${m.trl}`)}else{score-=8;reasons.push(`УГТ ${trl} вне основного ориентира ${m.trl}`)}
 let req=Number(p.request)||0;if(!m.amount||!req||req<=m.amount){if(m.amount)reasons.push('Запрашиваемая сумма укладывается в демонстрационный лимит')}else{score-=9;reasons.push('Запрос выше демонстрационного лимита')}
 if(p.supportType&&p.supportType!=='Все типы'&&(m.type===p.supportType||m.financing===p.supportType)){reasons.push('Совпадает предпочитаемый тип поддержки')}else if(p.supportType&&p.supportType!=='Все типы'){score-=3}
 return {score:Math.max(25,Math.min(99,score)),reasons};}
function computedMeasures(){return measures.map(m=>({...m,...scoreMeasure(m,profile)})).sort((a,b)=>b.score-a.score)}
function renderMeasureCard(m){return `<article class="measure-card"><div class="measure-info"><div class="measure-labels"><span class="match-badge">${m.score}% соответствия</span><span class="type-badge">${esc(m.type)}</span>${m.demo?'<span class="demo-badge">ДЕМО-ЗАПИСЬ</span>':''}</div><h3>${esc(m.title)}</h3><p>${esc(m.desc)}</p><div class="measure-tags">${(m.directions||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div><div class="measure-stats"><div class="measure-stat"><small>Размер поддержки</small><b>${m.amount?`до ${money(m.amount)}`:'По условиям программы'}</b></div><div class="measure-stat"><small>Финансирование</small><b>${esc(m.financing)}</b></div><div class="measure-stat"><small>Уровень готовности</small><b>TRL ${esc(m.trl)}</b></div></div><div class="measure-actions"><button class="btn btn-outline btn-sm" data-action="measure-detail" data-id="${m.id}">Подробнее</button><label class="compare-check"><input type="checkbox" data-action="toggle-compare" data-id="${m.id}" ${compareIds.includes(m.id)?'checked':''}>Добавить<br>к сравнению</label></div></article>`}
function renderMeasures(){let list=computedMeasures().filter(m=>(filterType==='Все меры'||m.type===filterType||m.financing===filterType)&&(filterDirection==='Все направления'||m.directions.includes(filterDirection))&&(filterRegion==='Федеральные и региональные'||m.region===filterRegion)&&(m.title.toLowerCase().includes(searchTerm.toLowerCase())||m.desc.toLowerCase().includes(searchTerm.toLowerCase())));let shown=showAllMeasures?list:list.slice(0,3);return `<div class="page-head"><div><div class="eyebrow">Рекомендации по проекту</div><h1>Подбор мер поддержки</h1><p class="page-lead">Система сопоставляет профиль проекта с демонстрационными условиями программ, проверяет ограничения и ранжирует варианты.</p></div><button class="btn btn-outline btn-sm" data-action="how-it-works">${icon('play',16)} Как это работает?</button></div>${stepper(2)}
 <div class="measures-layout"><section><div class="measure-toolbar"><select id="filter-type"><option>Все меры</option><option>Грант</option><option>Субсидия</option><option>Льготный заём</option><option>Налоговые льготы</option><option>Конкурс / грант</option></select><select id="filter-direction"><option>Все направления</option>${['Цифровые технологии','Инновации','НИОКР','ИИ','Стартапы','Региональная поддержка','Промышленность','Энергоэффективность'].map(x=>`<option>${x}</option>`).join('')}</select><select id="filter-region"><option>Федеральные и региональные</option><option>Федеральный</option><option>Ставропольский край</option></select><div class="measure-count">Найдено мер: <b>${list.length}</b></div></div><div class="notice">${icon('spark')} ИИ-система сопоставила проект с условиями каталога и рассчитала предварительный рейтинг. <b>Все карточки в этом стенде — демонстрационные.</b></div><div class="field" style="margin-bottom:14px"><input class="control" id="measure-search" placeholder="Поиск по названию или описанию меры" value="${esc(searchTerm)}"></div><div class="measure-list">${shown.length?shown.map(renderMeasureCard).join(''):'<div class="card empty-state"><div class="empty-icon">'+icon('search',26)+'</div><h3>Подходящие меры не найдены</h3><p>Измените фильтры или сбросьте поиск, чтобы посмотреть другие демонстрационные записи.</p><button class="btn btn-outline" data-action="reset-filters">Сбросить фильтры</button></div>'}</div>${list.length>3?`<button class="more-button" data-action="toggle-more">${showAllMeasures?'Свернуть список':'Показать ещё '+(list.length-3)+' мер поддержки'}　⌄</button>`:''}<p class="footer-note">Процент соответствия — результат упрощённого алгоритма демонстрационного прототипа, а не вероятность получения финансирования. Требования, сроки, суммы и наличие программ необходимо проверить по официальным источникам. Целевой объём будущего каталога — не менее 50 карточек; здесь используется 12 тестовых записей.</p></section>
 <aside class="measures-aside">${renderCompareCard()}<div class="card filter-card"><h3>Уточните результаты</h3><div class="filter-group"><strong>Тип меры</strong><div class="filter-options">${['Грант','Субсидия','Льготный заём','Налоговые льготы','Конкурс / грант'].map(x=>`<label><input type="checkbox" class="type-check" value="${x}" ${filterType===x?'checked':''}>${x}</label>`).join('')}</div></div><div class="filter-group"><strong>Направления</strong><div class="select-wrap"><select class="control" id="filter-direction-side"><option>Все направления</option>${['Цифровые технологии','Инновации','НИОКР','ИИ','Стартапы','Региональная поддержка','Промышленность','Энергоэффективность'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="filter-group"><strong>Регион реализации</strong><div class="select-wrap"><select class="control" id="filter-region-side"><option>Федеральные и региональные</option><option>Федеральный</option><option>Ставропольский край</option></select></div></div><button class="btn btn-outline btn-sm btn-block" data-action="reset-filters">${icon('refresh',15)} Сбросить фильтры</button></div></aside></div>`}
function renderCompareCard(){let items=compareIds.map(id=>measures.find(m=>m.id===id)).filter(Boolean);return `<div class="compare-card"><h3>Выбранные для сравнения (${items.length})</h3>${items.length?items.map(m=>`<div class="compare-row"><span>${esc(m.title)}</span><button data-action="remove-compare" data-id="${m.id}" aria-label="Удалить">×</button></div>`).join(''):'<div class="muted tiny" style="padding:8px 0 13px">Добавьте меры из списка, чтобы сравнить их условия.</div>'}<button class="btn btn-primary btn-sm btn-block" data-action="compare" ${items.length<2?'disabled':''}>Сравнить</button></div>`}
function renderProjects(){return `<div class="page-head"><div><div class="eyebrow">Рабочее пространство</div><h1>Мои проекты</h1><p class="page-lead">Сохраняйте профили проектов и возвращайтесь к их подборкам мер поддержки.</p></div><button class="btn btn-primary" data-action="new-project">${icon('plus')} Создать проект</button></div>${projects.length?`<div class="stat-grid"><div class="card stat-card"><small>Всего проектов</small><strong>${projects.length}</strong><span>В локальном демо-хранилище</span></div><div class="card stat-card"><small>С завершённым подбором</small><strong>${projects.filter(p=>p.status==='Анализ завершён').length}</strong><span>Демонстрационные результаты</span></div><div class="card stat-card"><small>Последнее изменение</small><strong style="font-size:20px">${esc(projects[0].date||'—')}</strong><span>Дата браузера</span></div></div><div class="card table-card"><table class="simple-table"><thead><tr><th>Проект</th><th>Отрасль</th><th>Регион</th><th>Статус</th><th>Дата</th><th></th></tr></thead><tbody>${projects.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="tiny muted">${esc(p.direction||'')}</div></td><td>${esc(p.industry||'—')}</td><td>${esc(p.region||'—')}</td><td><span class="${p.status==='Черновик'?'status-draft':'status-ok'}">${esc(p.status||'Черновик')}</span></td><td>${esc(p.date||'—')}</td><td><button class="btn btn-outline btn-sm" data-action="load-project" data-id="${esc(p.id)}">Открыть</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="card empty-state"><div class="empty-icon">${icon('file',27)}</div><h3>Здесь пока нет сохранённых проектов</h3><p>Создайте профиль проекта — система сформирует демонстрационную подборку мер поддержки.</p><button class="btn btn-primary" data-action="new-project">${icon('plus')} Создать проект</button><div class="footer-note">Примерные карточки на главной странице не являются сохранёнными проектами.</div></div>`}`}
function renderAnalytics(){let list=computedMeasures();return `<div class="page-head"><div><div class="eyebrow">Обзор данных</div><h1>Аналитика</h1><p class="page-lead">Демонстрационные показатели работы прототипа и параметров текущего профиля.</p></div></div><div class="stat-grid"><div class="card stat-card"><small>Записей в тестовом каталоге</small><strong>12</strong><span>Целевой ориентир MVP — от 50</span></div><div class="card stat-card"><small>Рекомендаций в выдаче</small><strong>${Math.min(10,list.length)}</strong><span>Демонстрационная сортировка</span></div><div class="card stat-card"><small>Текущий профиль проекта</small><strong style="font-size:20px">УГТ ${esc(profile.trl)}</strong><span>${esc(profile.region)}</span></div></div><div class="info-grid"><div class="card info-card"><h3>Как формируется рейтинг</h3><p>Прототип проверяет территорию реализации, отрасль, направление, уровень готовности технологии и сумму запроса. Совпадения дают баллы, несоответствия снижают рейтинг. Это упрощённая демонстрационная логика.</p></div><div class="card info-card"><h3>Что нужно проверить в пилоте</h3><p>Полноту выявления подходящих программ, долю релевантных рекомендаций, корректность обязательных условий и время получения результата. Целевое время ответа в материалах — до 5 секунд.</p></div></div><p class="footer-note">В исходных материалах не представлены результаты испытаний, статистика точности, интервью пользователей или подтверждённая экономия времени. Метрики выше не являются результатами пилота.</p>`}
function renderCompetitions(){return `<div class="page-head"><div><div class="eyebrow">Возможности для проекта</div><h1>Конкурсы и гранты</h1><p class="page-lead">Раздел показывает конкурсные и грантовые типы мер из тестового каталога.</p></div><button class="btn btn-primary" data-view="measures">Перейти к подбору ${icon('arrow')}</button></div><div class="measure-list">${computedMeasures().filter(m=>m.type==='Грант'||m.type==='Конкурс / грант').slice(0,5).map(renderMeasureCard).join('')}</div><p class="footer-note">Это демонстрационные карточки. Действующие конкурсы, даты подачи и официальные положения в прототип не подключены.</p>`}
function renderKnowledge(){return `<div class="page-head"><div><div class="eyebrow">Справочная информация</div><h1>База знаний</h1><p class="page-lead">Структура будущей базы программ поддержки и правила работы с данными.</p></div></div><div class="info-grid"><div class="card info-card"><h3>${icon('file',19)} Карточка программы</h3><p>Получатели, регион действия, отрасли, размер и форма поддержки, сроки, документы, обязательные условия и ограничения.</p></div><div class="card info-card"><h3>${icon('check',19)} Проверка требований</h3><p>Экспертные правила должны отсеивать программы, которым проект явно не соответствует: регион, тип заявителя, отрасль, стадия и сроки.</p></div><div class="card info-card"><h3>${icon('spark',19)} Ранжирование</h3><p>Взвешенные критерии формируют рейтинг релевантности; анализ текста помогает сопоставить тему проекта и формулировки программ.</p></div><div class="card info-card"><h3>${icon('refresh',19)} Актуализация данных</h3><p>Для каждой записи необходим первоисточник, дата последней проверки, владелец данных и регламент обновления.</p></div></div><div class="notice" style="margin-top:20px">${icon('info')} Фактический каталог официальных программ и процесс его обновления пока не подключены. В демо используется 12 тестовых записей.</div>`}
function renderNotifications(){return `<div class="page-head"><div><div class="eyebrow">Центр событий</div><h1>Уведомления</h1><p class="page-lead">Пример того, как могут выглядеть системные уведомления.</p></div></div><div class="card table-card"><div style="padding:18px 21px;border-bottom:1px solid #edf0f7"><b>Проверка профиля проекта</b><span class="tag" style="margin-left:9px">Новое</span><p class="muted" style="margin:5px 0 0">Заполните регион и параметры финансирования, чтобы завершить демонстрационный подбор.</p><small class="muted">Сегодня</small></div><div style="padding:18px 21px;border-bottom:1px solid #edf0f7"><b>Обновление базы знаний</b><p class="muted" style="margin:5px 0 0">В рабочей версии здесь будут отображаться изменения карточек программ и даты проверки первоисточников.</p><small class="muted">Пример уведомления</small></div><div style="padding:18px 21px"><b>Подбор мер завершён</b><p class="muted" style="margin:5px 0 0">Результаты доступны в разделе «Подбор мер».</p><small class="muted">Пример уведомления</small></div></div>`}
function renderSettings(){return `<div class="page-head"><div><div class="eyebrow">Параметры профиля</div><h1>Настройки</h1><p class="page-lead">Настройки тестового интерфейса.</p></div></div><div class="card info-card"><h3>Профиль организации</h3><p><b>Иванов И.И.</b><br>ООО «ТехноИнновации»<br>Эти данные показаны в макете интерфейса и не связаны с учётной записью.</p><button class="btn btn-outline btn-sm" style="margin-top:17px" data-action="toast-settings">Редактировать профиль</button></div><div class="card info-card" style="margin-top:16px"><h3>Данные прототипа</h3><p>Сбросить проекты, сохранённые локально в этом браузере, и вернуть начальный пример.</p><button class="btn btn-outline btn-sm" style="margin-top:17px" data-action="clear-data">Сбросить демо-данные</button></div>`}
function bindView(){const t=$('#filter-type');if(t){t.value=filterType;t.addEventListener('change',e=>{filterType=e.target.value;showAllMeasures=false;render()})}const d=$('#filter-direction');if(d){d.value=filterDirection;d.addEventListener('change',e=>{filterDirection=e.target.value;render()})}const r=$('#filter-region');if(r){r.value=filterRegion;r.addEventListener('change',e=>{filterRegion=e.target.value;render()})}const s=$('#measure-search');if(s){s.addEventListener('input',e=>{searchTerm=e.target.value;let pos=e.target.selectionStart;render();let next=$('#measure-search');next.focus();next.setSelectionRange(pos,pos)})}const ds=$('#filter-direction-side');if(ds){ds.value=filterDirection;ds.addEventListener('change',e=>{filterDirection=e.target.value;render()})}const rs=$('#filter-region-side');if(rs){rs.value=filterRegion;rs.addEventListener('change',e=>{filterRegion=e.target.value;render()})}$$('.type-check').forEach(c=>c.addEventListener('change',e=>{filterType=e.target.checked?e.target.value:'Все меры';render()}));if(view==='wizard'){const f=$('#main-content');f.addEventListener('input',wizardInput,{once:false});f.addEventListener('change',wizardInput,{once:false})}}
function wizardInput(e){let el=e.target;if(!el.name)return;let val=el.type==='number'?Number(el.value):el.type==='range'?Number(el.value):el.value;profile[el.name]=val;if(el.name==='name')$('#name-count').textContent=el.value.length+'/200';if(el.name==='description')$('#desc-count').textContent=el.value.length+'/2000';if(el.name==='trl'){$('#trl-value').textContent='УГТ '+val+' — '+['Идея','Концепция','Разработка','Готов к реализации'][Math.min(3,Math.floor((val-1)/3))]}}
function modal(html,wide=false){$('#modal-root').innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</section></div>`}
function closeModal(){$('#modal-root').innerHTML=''}
function openMeasureDetail(id){const m=computedMeasures().find(x=>x.id===id)||measures.find(x=>x.id===id);if(!m)return;modal(`<div class="modal-head"><div><div class="measure-labels"><span class="match-badge">${m.score||m.match}% соответствия</span><span class="type-badge">${esc(m.type)}</span><span class="demo-badge">ДЕМО-КАРТОЧКА</span></div><h2>${esc(m.title)}</h2><p>Предварительное объяснение соответствия профилю проекта</p></div><button class="modal-close" data-action="close-modal">×</button></div><div class="detail-grid"><div class="detail-panel"><h4>Почему рекомендация показана</h4><ul class="check-list">${(m.reasons||m.criteria||[]).map(r=>`<li>${icon('check')}${esc(r)}</li>`).join('')}</ul><h4 style="margin-top:18px">Описание</h4><p>${esc(m.desc)}</p></div><div class="detail-panel"><h4>Параметры карточки</h4><p><b>Размер поддержки:</b> ${m.amount?'до '+money(m.amount):'не указан'}<br><b>Форма:</b> ${esc(m.financing)}<br><b>Регион:</b> ${esc(m.region)}<br><b>УГТ:</b> TRL ${esc(m.trl)}</p><h4 style="margin-top:17px">Ограничения и проверка</h4><p>${esc(m.limitations||'Параметры демонстрационные.')}</p><p style="margin-top:11px;color:#a45f32"><b>Первоисточник:</b> не подключён в тестовом стенде. Перед подачей заявки необходимо проверить действующие условия у оператора программы.</p></div></div><div class="modal-actions"><button class="btn btn-outline" data-action="toggle-compare-modal" data-id="${m.id}">${compareIds.includes(m.id)?'Убрать из сравнения':'Добавить к сравнению'}</button><button class="btn btn-primary" data-action="close-modal">Закрыть</button></div>`)}
function openCompare(){let arr=compareIds.map(id=>computedMeasures().find(m=>m.id===id)).filter(Boolean);if(arr.length<2){toast('Выберите минимум две меры для сравнения.');return}modal(`<div class="modal-head"><div><div class="eyebrow">Сравнение программ</div><h2>Сравнение выбранных мер поддержки</h2><p>Сопоставление параметров демонстрационных карточек</p></div><button class="modal-close" data-action="close-modal">×</button></div><div class="table-card" style="overflow:auto"><table class="simple-table"><thead><tr><th>Параметр</th>${arr.map(m=>`<th>${esc(m.title)}</th>`).join('')}</tr></thead><tbody>${[['Соответствие',m=>m.score+'%'],['Тип меры',m=>m.type],['Размер',m=>m.amount?'до '+money(m.amount):'Не указан'],['Финансирование',m=>m.financing],['Регион',m=>m.region],['УГТ',m=>'TRL '+m.trl],['Демо-запись',m=>'Да — условия не подтверждены']].map(([label,fn])=>`<tr><td><b>${label}</b></td>${arr.map(m=>`<td>${esc(fn(m))}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="footer-note">Сравнение носит демонстрационный характер: для карточек не подключены официальные положения и источники.</p><div class="modal-actions"><button class="btn btn-primary" data-action="close-modal">Готово</button></div>`,true)}
function openHow(){modal(`<div class="modal-head"><div><div class="eyebrow">Логика сервиса</div><h2>Как работает подбор мер</h2><p>Планируемая логика MVP согласно материалам проекта</p></div><button class="modal-close" data-action="close-modal">×</button></div><div class="info-grid"><div class="detail-panel"><h4>1. Профиль проекта</h4><p>Пользователь указывает отрасль, регион, стадию, тип заявителя, бюджет, потребность в финансировании и описание технологии.</p></div><div class="detail-panel"><h4>2. Проверка требований</h4><p>Экспертные правила проверяют обязательные условия: регион, категорию заявителя, отрасль, стадию проекта и сроки подачи.</p></div><div class="detail-panel"><h4>3. Ранжирование</h4><p>Взвешенные критерии формируют рейтинг программ; анализ текста помогает сопоставить формулировки проекта и программы.</p></div><div class="detail-panel"><h4>4. Объяснение результата</h4><p>Пользователь видит совпавшие критерии, ограничения, параметры поддержки и ссылки на первоисточники.</p></div></div><div class="notice" style="margin-top:17px">${icon('info')} В этом прототипе показана упрощённая локальная имитация логики. Обученная ML-модель, подключённый каталог и реальные ссылки не представлены.</div><div class="modal-actions"><button class="btn btn-primary" data-action="close-modal">Понятно</button></div>`)}
function openChat(){modal(`<div class="modal-head"><div><div class="eyebrow">ИИ-помощник</div><h2>Помощь с описанием проекта</h2><p>Демонстрационный помощник с заранее подготовленными подсказками</p></div><button class="modal-close" data-action="close-modal">×</button></div><div class="chat-messages" id="chat-messages"><div class="chat-bubble bot">Здравствуйте! Могу подсказать, какие сведения о проекте полезно указать для подбора мер поддержки. Например: цель разработки, отрасль, стадия, регион и потребность в финансировании.</div></div><div class="chat-compose"><input class="control" id="chat-input" placeholder="Напишите вопрос..."/><button class="btn btn-primary" data-action="chat-send">Отправить</button></div><div class="footer-note">Демонстрация интерфейса: ответы формируются по локальным шаблонам, внешняя языковая модель не подключена.</div>`)}
function chatSend(){const input=$('#chat-input');const msg=input?.value.trim();if(!msg)return;const box=$('#chat-messages');box.insertAdjacentHTML('beforeend',`<div class="chat-bubble user">${esc(msg)}</div>`);let answer='Для качественного профиля укажите: какую технологию разрабатываете, какую проблему она решает, кто заявитель, где будет реализован проект, на какой стадии находится разработка и сколько средств требуется. Эти сведения помогут проверить базовые условия программ.';if(/бюджет|сумм|финанс/i.test(msg))answer='Разделите общий бюджет проекта, собственные средства и запрашиваемую сумму. Важно, чтобы эти значения были согласованы и соответствовали условиям выбранной программы.';if(/стад|угт|готов/i.test(msg))answer='Уровень готовности описывает стадию технологии: от идеи и концепции до разработки и готовности к реализации. Укажите текущую стадию, а не желаемую.';if(/описан|текст|сформулир/i.test(msg))answer='Попробуйте описать проект по схеме: проблема → предлагаемая технология → для кого решение → ожидаемый результат → текущая стадия и план работ.';box.insertAdjacentHTML('beforeend',`<div class="chat-bubble bot">${esc(answer)}</div>`);input.value='';box.scrollTop=box.scrollHeight}
function wizardNext(){if(wizardStep===0){if(!profile.name?.trim()||!profile.description?.trim()||!profile.industry||!profile.region){toast('Заполните название, описание, отрасль и регион проекта.');return}wizardStep=1;render();return}if(wizardStep===1){if(Number(profile.request)>Number(profile.budget)&&Number(profile.budget)>0){toast('Запрашиваемая сумма не должна превышать бюджет проекта.');return}wizardStep=2;render();return}saveProject()}
function startNew(){profile={...initialProfile,name:'',description:'',budget:0,own:0,request:0,trl:1};wizardStep=0;setView('wizard')}
function handleAction(action,el){const id=el.dataset.id;switch(action){case'new-project':startNew();break;case'how-it-works':openHow();break;case'open-chat':openChat();break;case'wizard-next':wizardNext();break;case'wizard-back':if(wizardStep>0){wizardStep--;render()}else setView('home');break;case'fill-example':profile={...initialProfile};render();toast('Заполнен демонстрационный профиль проекта.');break;case'measure-detail':openMeasureDetail(id);break;case'toggle-compare':if(compareIds.includes(id))compareIds=compareIds.filter(x=>x!==id);else if(compareIds.length<4)compareIds.push(id);else toast('В сравнении можно оставить не более четырёх мер.');render();break;case'remove-compare':compareIds=compareIds.filter(x=>x!==id);render();break;case'compare':openCompare();break;case'toggle-more':showAllMeasures=!showAllMeasures;render();break;case'reset-filters':filterType='Все меры';filterDirection='Все направления';filterRegion='Федеральные и региональные';searchTerm='';showAllMeasures=false;render();break;case'close-modal':closeModal();break;case'backdrop-close':if(el.classList.contains('modal-backdrop'))closeModal();break;case'toggle-compare-modal':if(compareIds.includes(id))compareIds=compareIds.filter(x=>x!==id);else compareIds.push(id);closeModal();render();break;case'chat-send':chatSend();break;case'help':openHow();break;case'profile-menu':modal(`<div class="modal-head"><div><h2>Профиль пользователя</h2><p>Макет пользовательского меню</p></div><button class="modal-close" data-action="close-modal">×</button></div><div class="detail-panel"><b>Иванов И.И.</b><p>ООО «ТехноИнновации»<br>Роль: пользователь</p></div><div class="modal-actions"><button class="btn btn-primary" data-action="close-modal">Закрыть</button></div>`);break;case'load-project':case'open-project':{let p=projects.find(x=>x.id===id);if(p){profile={...p};wizardStep=2;selectedProjectId=id;setView('wizard')}else{toast('Это демонстрационная карточка, а не сохранённый проект.');profile={...initialProfile};wizardStep=2;setView('wizard')}break}case'project-menu':{let p=projects.find(x=>x.id===id);if(p){modal(`<div class="modal-head"><div><h2>${esc(p.name)}</h2><p>Действия с проектом</p></div><button class="modal-close" data-action="close-modal">×</button></div><div class="modal-actions"><button class="btn btn-outline" data-action="edit-project" data-id="${id}">Редактировать</button><button class="btn btn-primary" data-action="close-modal">Закрыть</button></div>`)}else toast('Действия доступны для сохранённых проектов.');break}case'edit-project':{let p=projects.find(x=>x.id===id);if(p){profile={...p};wizardStep=0;closeModal();setView('wizard')}break}case'toast-settings':toast('Редактирование профиля недоступно в демонстрационном стенде.');break;case'clear-data':projects=[];persistProjects();compareIds=[];closeModal();setView('settings');toast('Локальные проекты удалены.');break;}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){setView(nav.dataset.view);return}const el=e.target.closest('[data-action]');if(el){const act=el.dataset.action;if(act==='toggle-compare'&&e.target.tagName==='INPUT')return;handleAction(act,el)}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-action="toggle-compare"]');if(el){const id=el.dataset.id;if(el.checked){if(!compareIds.includes(id)){if(compareIds.length<4)compareIds.push(id);else{el.checked=false;toast('В сравнении можно оставить не более четырёх мер.')}}}else compareIds=compareIds.filter(x=>x!==id);render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='chat-input')chatSend()});
render();
</script>
</body>
</html>
